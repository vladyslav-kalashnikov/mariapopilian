# Netlify — статична версія сайту (без CMS-сервера: адмінка /admin тут не працює,
# контент береться зі src/content/defaultSiteContent.json)
[build]
  command = "npm run build"
  publish = "dist"

# API немає — чесний 404 замість index.html
[[redirects]]
  from = "/api/*"
  to = "/404"
  status = 404

# Сторінки пререндерені (scripts/prerender.mjs): /about → about/index.html — Netlify віддає їх сам.
# Адмінка — SPA без пререндеру (на Netlify без сервера вона лише покаже форму входу)
[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

# Решта невідомих адрес — справжній 404 (SPA покаже «Сторінку не знайдено»)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Кеш: файли з хешем у назві — назавжди, фото — тиждень
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/seed-images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
