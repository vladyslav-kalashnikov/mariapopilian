    <!-- Головне фото починає вантажитись одразу, не чекаючи JS (телефон бере мініатюру) -->
    <link rel="preload" as="image" href="/seed-images/ig/paris-wings.jpg" imagesrcset="/seed-images/thumbs/ig/paris-wings.jpg 720w, /seed-images/ig/paris-wings.jpg 1440w" imagesizes="(min-width: 1024px) 45vw, 90vw" fetchpriority="high" />
    <style>
      html, body { background: #050505; margin: 0; }
      /* Заставка, поки вантажиться JS: React замінить вміст #root */
      .boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(circle at top, #1b1610 0%, #050505 45%, #020202 100%); color: #f2ebe0;
        font-family: "Playfair Display", Georgia, serif; }
      .boot__name { font-size: clamp(2.4rem, 8vw, 4.5rem); letter-spacing: -0.02em; }
      .boot__name em { color: #b39a74; }
      .boot__line { width: 120px; height: 1px; background: rgba(179,154,116,.25); overflow: hidden; }
      .boot__line::after { content: ""; display: block; width: 40%; height: 100%; background: #b39a74; animation: boot 1.1s ease-in-out infinite; }
      @keyframes boot { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    </style>
  </head>

  <body>
    <div id="root"><div class="boot"><div class="boot__name">Maria <em>Popilian</em></div><div class="boot__line"></div></div></div>
